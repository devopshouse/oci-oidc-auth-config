name: Setup OCI OIDC Auth
description: Keyless OCI auth via OIDC — exchanges GitHub JWT for OCI UPST, writes ~/.oci/config, and installs the OCI CLI.
author: devopshouse

branding:
  icon: lock
  color: red

inputs:
  config_json:
    description: >
      JSON string containing all OCI connection parameters.
      Required keys: oci_idcs_endpoint, oci_client_id, oci_client_secret,
      oci_region, oci_tenancy_id, oci_compartment_id.
      When provided, individual OCI inputs are ignored.
    required: false
    default: ''
  oci_idcs_endpoint:
    description: >
      IDCS identity domain URL (e.g. https://<domain>.identity.oraclecloud.com).
      Used only when config_json is not provided.
    required: false
    default: ''
  oci_client_id:
    description: >
      OAuth2 confidential application client ID.
      Used only when config_json is not provided.
    required: false
    default: ''
  oci_client_secret:
    description: >
      OAuth2 confidential application client secret.
      Used only when config_json is not provided.
    required: false
    default: ''
  oci_region:
    description: >
      OCI region identifier (e.g. sa-saopaulo-1).
      Used only when config_json is not provided.
    required: false
    default: ''
  oci_tenancy_id:
    description: >
      Tenancy OCID.
      Used only when config_json is not provided.
    required: false
    default: ''
  oci_compartment_id:
    description: >
      Compartment OCID.
      Used only when config_json is not provided.
    required: false
    default: ''
  oidc_audience:
    description: Audience claim for the GitHub OIDC token
    required: false
    default: 'https://cloud.oracle.com'
  oci_profile:
    description: OCI config profile name written to ~/.oci/config
    required: false
    default: DEFAULT

outputs:
  oci_region:
    description: OCI region identifier
    value: ${{ steps.resolve.outputs.oci_region }}
  oci_tenancy_id:
    description: Tenancy OCID
    value: ${{ steps.resolve.outputs.oci_tenancy_id }}
  oci_compartment_id:
    description: Compartment OCID
    value: ${{ steps.resolve.outputs.oci_compartment_id }}
  oci_idcs_endpoint:
    description: IDCS identity domain URL
    value: ${{ steps.resolve.outputs.oci_idcs_endpoint }}

runs:
  using: composite
  steps:
    - name: Resolve OCI parameters
      id: resolve
      shell: bash
      env:
        CONFIG_JSON: ${{ inputs.config_json }}
        OCI_IDCS_ENDPOINT: ${{ inputs.oci_idcs_endpoint }}
        OCI_CLIENT_ID: ${{ inputs.oci_client_id }}
        OCI_CLIENT_SECRET: ${{ inputs.oci_client_secret }}
        OCI_REGION: ${{ inputs.oci_region }}
        OCI_TENANCY_ID: ${{ inputs.oci_tenancy_id }}
        OCI_COMPARTMENT_ID: ${{ inputs.oci_compartment_id }}
      run: "$GITHUB_ACTION_PATH/scripts/resolve-oci-config.sh"

    - name: Request GitHub OIDC token
      id: get_oidc_token
      shell: bash
      env:
        CI_PLATFORM: github
        OIDC_AUDIENCE: ${{ inputs.oidc_audience }}
      run: "$GITHUB_ACTION_PATH/scripts/get-oidc-token.sh"

    - name: Exchange OIDC token for OCI UPST
      shell: bash
      env:
        OIDC_TOKEN: ${{ steps.get_oidc_token.outputs.oidc_token }}
        OCI_IDCS_ENDPOINT: ${{ steps.resolve.outputs.oci_idcs_endpoint }}
        OCI_CLIENT_ID: ${{ steps.resolve.outputs.oci_client_id }}
        OCI_CLIENT_SECRET: ${{ steps.resolve.outputs.oci_client_secret }}
      run: "$GITHUB_ACTION_PATH/scripts/exchange-token.sh"

    - name: Write ~/.oci/config and ~/.oci/oci_cli_rc
      shell: bash
      env:
        OCI_TENANCY_ID: ${{ steps.resolve.outputs.oci_tenancy_id }}
        OCI_REGION: ${{ steps.resolve.outputs.oci_region }}
        OCI_COMPARTMENT_ID: ${{ steps.resolve.outputs.oci_compartment_id }}
        OCI_PROFILE: ${{ inputs.oci_profile }}
      run: "$GITHUB_ACTION_PATH/scripts/write-oci-config.sh"

    - name: Restore OCI CLI cache
      id: cache-oci-cli
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          ~/.local/bin
          ~/.local/share/uv/tools/oci-cli
        key: ${{ runner.os }}-${{ runner.environment }}-oidc-auth-cli

    - name: Install OCI CLI
      if: steps.cache-oci-cli.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.local/bin:$PATH"
        uv tool install oci-cli

    - name: Save OCI CLI cache
      if: steps.cache-oci-cli.outputs.cache-hit != 'true'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          ~/.local/bin
          ~/.local/share/uv/tools/oci-cli
        key: ${{ runner.os }}-${{ runner.environment }}-oidc-auth-cli

    - name: Add OCI CLI to PATH
      shell: bash
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
