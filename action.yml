name: Setup OCI OIDC Auth
description: Keyless OCI auth via OIDC - exchanges GitHub JWT for OCI UPST, writes ~/.oci/config, and installs the OCI CLI.
author: devopshouse

branding:
  icon: lock
  color: red

inputs:
  config_json:
    description: >
      JSON string with all OCI + OCIR parameters in a single unified blob
      (the OCI_OIDC_CONFIG secret emitted by terraform-oci-oidc-federation).
      Required OCI keys: oci_idcs_endpoint, oci_client_id, oci_client_secret,
      oci_region, oci_tenancy_id, oci_compartment_id.
      Optional OCIR keys: ocir_username, ocir_password, ocir_url (registry
      derived automatically; when all three are absent OCIR export is skipped).
      When provided, individual OCI and OCIR inputs are ignored.
    required: false
    default: ''
  oci_idcs_endpoint:
    description: >
      IDCS identity domain URL (e.g. https://<domain>.identity.oraclecloud.com).
      Used only when config_json is not provided.
    required: false
    default: ''
  oci_client_id:
    description: >
      OAuth2 confidential application client ID.
      Used only when config_json is not provided.
    required: false
    default: ''
  oci_client_secret:
    description: >
      OAuth2 confidential application client secret.
      Used only when config_json is not provided.
    required: false
    default: ''
  oci_region:
    description: >
      OCI region identifier (e.g. sa-saopaulo-1).
      Used only when config_json is not provided.
    required: false
    default: ''
  oci_tenancy_id:
    description: >
      Tenancy OCID.
      Used only when config_json is not provided.
    required: false
    default: ''
  oci_compartment_id:
    description: >
      Compartment OCID.
      Used only when config_json is not provided.
    required: false
    default: ''
  oidc_audience:
    description: Audience claim for the GitHub OIDC token
    required: false
    default: 'https://cloud.oracle.com'
  oci_profile:
    description: OCI config profile name written to ~/.oci/config
    required: false
    default: DEFAULT
  ocir_username:
    description: >
      OCIR login username in the form <namespace>/<username>.
      Used only when config_json is not provided (individual override).
    required: false
    default: ''
  ocir_password:
    description: >
      OCIR auth token (password) for Docker / Podman login.
      Used only when config_json is not provided (individual override).
    required: false
    default: ''
  ocir_url:
    description: >
      OCIR URL including namespace, e.g. ocir.<region>.oci.oraclecloud.com/<namespace>.
      Used only when config_json is not provided (individual override).
    required: false
    default: ''
  ocir_registry:
    description: >
      OCIR registry host, e.g. ocir.<region>.oci.oraclecloud.com.
      Used only when config_json is not provided (individual override).
    required: false
    default: ''
  ocir_login:
    description: >
      Write container auth config (~/.docker/config.json) automatically when OCIR
      credentials are resolved, so subsequent steps can run docker/podman/kaniko
      without a separate login step. Set to 'false' to skip. Default: 'true'.
    required: false
    default: 'true'

outputs:
  oci_region:
    description: OCI region identifier
  oci_tenancy_id:
    description: Tenancy OCID
  oci_compartment_id:
    description: Compartment OCID
  oci_idcs_endpoint:
    description: IDCS identity domain URL

runs:
  using: node24
  main: dist/index.js
