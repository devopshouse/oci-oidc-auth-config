name: Setup OCI OIDC Auth
description: Keyless OCI auth via OIDC - exchanges GitHub JWT for OCI UPST, writes ~/.oci/config, and installs the OCI CLI.
author: devopshouse

branding:
  icon: lock
  color: red

inputs:
  config_json:
    description: >
      JSON string with all OCI parameters in a single unified blob
      (the OCI_OIDC_CONFIG secret emitted by terraform-oci-oidc-federation).
      Required OCI keys: oci_idcs_endpoint, oci_client_id, oci_client_secret,
      oci_region, oci_tenancy_id, oci_compartment_id.
      Any ocir_* keys in the blob are ignored — OCIR auth is now performed
      automatically via a short-lived bearer token (see ocir_login).
      When provided, individual OCI inputs are ignored.
    required: false
    default: ''
  oci_idcs_endpoint:
    description: >
      IDCS identity domain URL (e.g. https://<domain>.identity.oraclecloud.com).
      Used only when config_json is not provided.
    required: false
    default: ''
  oci_client_id:
    description: >
      OAuth2 confidential application client ID.
      Used only when config_json is not provided.
    required: false
    default: ''
  oci_client_secret:
    description: >
      OAuth2 confidential application client secret.
      Used only when config_json is not provided.
    required: false
    default: ''
  oci_region:
    description: >
      OCI region identifier (e.g. sa-saopaulo-1).
      Used only when config_json is not provided.
    required: false
    default: ''
  oci_tenancy_id:
    description: >
      Tenancy OCID.
      Used only when config_json is not provided.
    required: false
    default: ''
  oci_compartment_id:
    description: >
      Compartment OCID.
      Used only when config_json is not provided.
    required: false
    default: ''
  oidc_audience:
    description: Audience claim for the GitHub OIDC token
    required: false
    default: 'https://cloud.oracle.com'
  oci_profile:
    description: OCI config profile name written to ~/.oci/config
    required: false
    default: DEFAULT
  ocir_login:
    description: >
      Perform OCIR login automatically after OCI auth is set up.
      The action derives the registry host from oci_region, fetches the tenancy
      namespace, and obtains a short-lived Docker bearer token via the UPST —
      no long-lived auth token or OCIR secret required.
      Writes OCIR_REGISTRY, OCIR_URL, DOCKER_CONFIG, REGISTRY_AUTH_FILE to
      GITHUB_ENV and ~/.docker/config.json so docker/podman/kaniko work without
      an extra login step. Set to 'false' to skip. Default: 'true'.
    required: false
    default: 'true'

outputs:
  oci_region:
    description: OCI region identifier
  oci_tenancy_id:
    description: Tenancy OCID
  oci_compartment_id:
    description: Compartment OCID
  oci_idcs_endpoint:
    description: IDCS identity domain URL
  ocir_registry:
    description: OCIR registry host (e.g. gru.ocir.io). Only set when ocir_login is true.
  ocir_url:
    description: >
      OCIR URL including tenancy namespace (e.g. gru.ocir.io/mytenancy).
      Use as the image name prefix. Only set when ocir_login is true.

runs:
  using: node24
  main: dist/index.js
