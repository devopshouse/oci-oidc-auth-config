name: Build and publish podman-oci image

# Tags: the Podman version in the image (for example 5.4.2), the UTC build time (YYYYMMDDHHMM) and latest.
on:
  push:
    branches:
      - main
    paths:
      - 'docker/podman-oci/**'
      - '.github/workflows/build-podman-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # Required to push to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/devopshouse/podman-oci

jobs:
  build-push:
    name: Build and push podman-oci
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The Podman version comes from the Alpine package, so build once to read it.
      - name: Build amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/podman-oci
          file: docker/podman-oci/Dockerfile
          load: true
          tags: podman-oci:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Determine image tags
        id: tag
        run: |
          version="$(docker run --rm podman-oci:local /usr/bin/podman --version | awk '{print $3}')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Podman version not found in the image: $version"
            exit 1
          fi
          stamp="$(date -u +%Y%m%d%H%M)"
          echo "tags=${IMAGE}:${version},${IMAGE}:${stamp},${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/podman-oci
          file: docker/podman-oci/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.tags }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
