name: Build and publish podman-oci image

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'docker/podman-oci/Dockerfile'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. v3, v3.1.0)'
        required: true
        default: 'latest'

permissions:
  contents: read
  packages: write   # Required to push to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/devopshouse/oci-oidc-auth-config/podman-oci

jobs:
  build-push:
    name: Build and push podman-oci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine image tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
            MAJOR="v$(echo "${VERSION#v}" | cut -d. -f1)"
            echo "tags=${IMAGE}:${VERSION},${IMAGE}:${MAJOR},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/podman-oci
          file: docker/podman-oci/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
