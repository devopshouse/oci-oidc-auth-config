# Example: Build and push a container image to OCIR using GitHub OIDC authentication.
# Shows Docker, Podman and a BuildKit sidecar — keep the job that matches your runner.
# Note: Kubernetes-based runners without privileged container builds may not
# support Podman build reliably. Use the BuildKit sidecar there (Kaniko is deprecated).
# Copy this file to .github/workflows/ in your repository.
#
# Prerequisites:
#   - OCI_OIDC_CONFIG secret: a JSON map with a "ci" service account (or a flat JSON,
#     in which case remove service_account). Each account has the six required OCI fields.
#     No OCIR secrets needed — the action derives the registry and obtains
#     a short-lived bearer token automatically.
#
# With ocir_login: "true" (off by default) the action exports OCIR_REGISTRY, OCIR_URL,
# DOCKER_CONFIG, REGISTRY_AUTH_FILE to GITHUB_ENV and writes ~/.docker/config.json —
# no separate docker login step needed.
#
# Docker and Podman are pre-installed on ubuntu-latest runners.

name: OCIR — Build and Push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # Required to request a GitHub OIDC token

env:
  IMAGE_NAME: myapp   # Change to your image name

jobs:

  # ── Option A: Docker ──────────────────────────────────────────────────────────
  build-push-docker:
    name: Docker build & push
    runs-on: ubuntu-latest   # Docker is pre-installed

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup OCI OIDC Auth
        uses: devopshouse/oci-oidc-auth-config@v2
        with:
          config_json: ${{ secrets.OCI_OIDC_CONFIG }}
          service_account: ci   # key in the OCI_OIDC_CONFIG map; omit it when the secret is a flat JSON
          ocir_login: "true"   # derives registry from oci_region, fetches a bearer token via UPST
                               # and writes ~/.docker/config.json

      # OCIR_REGISTRY / OCIR_URL are now in GITHUB_ENV.
      # ~/.docker/config.json is already written — no docker login step needed.

      - name: Build and push
        run: |
          docker build -t "$OCIR_URL/$IMAGE_NAME:$GITHUB_SHA" .
          docker push "$OCIR_URL/$IMAGE_NAME:$GITHUB_SHA"
          docker tag  "$OCIR_URL/$IMAGE_NAME:$GITHUB_SHA" "$OCIR_URL/$IMAGE_NAME:latest"
          docker push "$OCIR_URL/$IMAGE_NAME:latest"

  # ── Option B: Podman ──────────────────────────────────────────────────────────
  build-push-podman:
    name: Podman build & push
    runs-on: ubuntu-latest   # Podman is pre-installed

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup OCI OIDC Auth
        uses: devopshouse/oci-oidc-auth-config@v2
        with:
          config_json: ${{ secrets.OCI_OIDC_CONFIG }}
          service_account: ci   # key in the OCI_OIDC_CONFIG map; omit it when the secret is a flat JSON
          ocir_login: "true"   # writes REGISTRY_AUTH_FILE, which podman honours

      # No podman login step needed.

      - name: Build and push
        run: |
          podman build -t "$OCIR_URL/$IMAGE_NAME:$GITHUB_SHA" .
          podman push "$OCIR_URL/$IMAGE_NAME:$GITHUB_SHA"
          podman tag  "$OCIR_URL/$IMAGE_NAME:$GITHUB_SHA" "$OCIR_URL/$IMAGE_NAME:latest"
          podman push "$OCIR_URL/$IMAGE_NAME:latest"

  # ── Option C: BuildKit sidecar (rootless, no Docker daemon in the build step) ─
  # For Kubernetes runners whose pod runs `buildkitd` next to the runner container,
  # listening on the pod loopback (no TLS: never expose it outside the pod). If the runner
  # already creates the remote builder at start, drop the "Use the BuildKit sidecar" step.
  # The cache repository $IMAGE_NAME/cache must exist in OCIR.
  build-push-buildkit:
    name: BuildKit build & push
    runs-on: [self-hosted, buildkit]   # Adjust to your runner labels

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup OCI OIDC Auth
        uses: devopshouse/oci-oidc-auth-config@v2
        with:
          config_json: ${{ secrets.OCI_OIDC_CONFIG }}
          service_account: ci   # key in the OCI_OIDC_CONFIG map; omit it when the secret is a flat JSON
          ocir_login: "true"    # the buildx client sends the credentials in ~/.docker/config.json

      - name: Use the BuildKit sidecar
        run: docker buildx create --name remote --driver remote --use tcp://127.0.0.1:1234

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.OCIR_URL }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.OCIR_URL }}/${{ env.IMAGE_NAME }}/cache:buildcache
          cache-to: type=registry,ref=${{ env.OCIR_URL }}/${{ env.IMAGE_NAME }}/cache:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
